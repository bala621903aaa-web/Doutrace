<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私聊档案 · 抖音导出</title><link rel="stylesheet" href="app.css"></head><body><main>
<header id="panelHeader" class="drag-handle"><div class="mark">档</div><div class="brand-copy"><h1>私聊档案</h1><p>抖音聊天记录保存在本机</p></div><span class="local">● 仅本机</span><button id="closePanel" class="icon-button" aria-label="收起面板" title="收起面板">×</button></header>
<section class="notice"><b>采集适配尚未验证</b><p id="notice">请在抖音网页打开目标私聊。实际消息与附件结构确认后，才会启用采集。</p></section>
<section class="capture"><div class="section-head"><div><h2>当前会话</h2><p id="pageState">正在检查页面…</p></div></div><div class="modes"><label><input type="radio" name="mode" value="loaded" checked> 当前已加载</label><label><input type="radio" name="mode" value="history"> 尽可能向前加载</label></div><div class="buttons"><button id="start" disabled>开始导出</button><button id="stop" class="secondary" disabled>停止并保存</button></div><div class="progress"><div id="meter"></div></div><p id="status" aria-live="polite">数据只保存在这台电脑。</p><button id="retry" class="text-button" hidden>重试失败附件</button></section>
<section><div class="section-head"><div><h2>本机档案</h2><p id="count">正在读取…</p></div></div><div id="archives" class="archives"></div></section><footer><button id="help" class="text-button">使用说明</button><span>v0.2.0</span></footer></main><script src="app.js"></script></body></html>
