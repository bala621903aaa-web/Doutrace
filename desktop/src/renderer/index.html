<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>抖音私聊档案</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #20242a; background: #f5f6f8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(680px, calc(100vw - 48px)); padding: 32px; border: 1px solid #dfe3e8; border-radius: 16px; background: #fff; box-shadow: 0 16px 40px #20242a12; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { line-height: 1.7; color: #5f6874; }
      .state { margin-top: 24px; padding: 16px; border-radius: 10px; background: #fff7e6; color: #7a4b00; }
      code { font-family: ui-monospace, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>抖音私聊档案 · 0.3.0</h1>
      <p>桌面子项目已建立。正式采集入口会在真实数据通道通过无滚动历史分页验证后开放。</p>
      <div class="state" id="state">正在读取门槛状态…</div>
    </main>
    <script>
      window.desktopArchive?.getState().then(state => {
        document.querySelector('#state').textContent = state.message + ' 当前版本：' + state.version;
      }).catch(() => {
        document.querySelector('#state').textContent = '无法读取桌面进程状态。';
      });
    </script>
  </body>
</html>
