<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>抖忆 · DouTrace</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <header id="app-titlebar" class="app-titlebar" aria-label="应用标题栏">
        <div class="app-titlebar__safe-area">
          <img class="app-titlebar__logo" src="./icons/doutrace-mark.svg" alt="" />
          <span class="app-titlebar__name">抖忆 · DouTrace</span>
        </div>
      </header>

      <div class="app-workspace">
        <nav id="primary-navigation" class="navigation-rail" aria-label="主导航">
          <div class="navigation-rail__primary">
            <button class="navigation-rail__item" type="button" data-route="archive" aria-label="聊天档案" title="聊天档案" aria-current="page">
              <img src="./icons/message-square.svg" alt="" />
            </button>
            <button class="navigation-rail__item" type="button" data-route="analysis" aria-label="聊天分析" title="聊天分析">
              <img src="./icons/chart-no-axes-column.svg" alt="" />
            </button>
            <button class="navigation-rail__item" type="button" data-route="media" aria-label="媒体资源" title="媒体资源">
              <img src="./icons/images.svg" alt="" />
            </button>
            <button class="navigation-rail__item" type="button" data-route="reminders" aria-label="火花提醒" title="火花提醒">
              <img src="./icons/flame.svg" alt="" />
            </button>
          </div>
          <div class="navigation-rail__footer">
            <button class="navigation-rail__item" type="button" data-route="settings" aria-label="设置" title="设置">
              <img src="./icons/settings.svg" alt="" />
            </button>
          </div>
        </nav>

        <main id="app-view" class="app-view">
          <section id="chat-archive-page" class="app-module chat-archive-module" data-module="archive" aria-label="聊天档案"></section>

          <section id="chat-analysis-page" class="app-module analysis-module" data-module="analysis" aria-labelledby="analysis-module-title" hidden>
            <header class="module-heading">
              <p class="module-heading__eyebrow">按已归档内容查看</p>
              <h1 id="analysis-module-title">聊天分析</h1>
              <p>从真实归档消息出发；当前尚未接入分析结果。</p>
            </header>
            <div class="analysis-tablist" role="tablist" aria-label="聊天分析标签">
              <button id="analysis-tab-overview" class="analysis-tab" type="button" role="tab" data-analysis-tab="overview" aria-controls="analysis-tab-panel" aria-selected="true" tabindex="0">总览</button>
              <button id="analysis-tab-interaction" class="analysis-tab" type="button" role="tab" data-analysis-tab="interaction" aria-controls="analysis-tab-panel" aria-selected="false" tabindex="-1">互动分析</button>
              <button id="analysis-tab-journey" class="analysis-tab" type="button" role="tab" data-analysis-tab="journey" aria-controls="analysis-tab-panel" aria-selected="false" tabindex="-1">聊天旅程</button>
              <button id="analysis-tab-ai" class="analysis-tab" type="button" role="tab" data-analysis-tab="ai" aria-controls="analysis-tab-panel" aria-selected="false" tabindex="-1">AI 洞察</button>
            </div>
            <section id="analysis-tab-panel" class="analysis-panel" role="tabpanel" tabindex="0" aria-labelledby="analysis-tab-overview">
              <h2 id="analysis-tab-title">总览</h2>
              <p id="analysis-tab-empty" class="module-empty" role="status">总览尚未接入真实归档统计。</p>
            </section>
          </section>

          <section id="media-page" class="app-module placeholder-module" data-module="media" aria-labelledby="media-title" hidden>
            <div class="module-placeholder">
              <h1 id="media-title">媒体资源</h1>
              <p role="status">媒体资源管理尚未提供。已保存的图片、语音和视频仍可在聊天档案中查看。</p>
            </div>
          </section>

          <section id="reminders-page" class="app-module placeholder-module" data-module="reminders" aria-labelledby="reminders-title" hidden>
            <div class="module-placeholder">
              <h1 id="reminders-title">火花提醒</h1>
              <p role="status">火花提醒能力尚未提供；当前不会生成或展示提醒。</p>
            </div>
          </section>

          <section id="settings-page" class="app-module placeholder-module" data-module="settings" aria-labelledby="settings-title" hidden>
            <div class="module-placeholder">
              <h1 id="settings-title">设置</h1>
              <p role="status">设置页面尚未提供。</p>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
